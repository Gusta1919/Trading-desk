[package]
name = "trade-assistant"
version = "0.1.0"
description = "Trade Assistant — lokalny dziennik tradingowy"
authors = ["Gustaw"]
edition = "2021"

[lib]
name = "trade_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
